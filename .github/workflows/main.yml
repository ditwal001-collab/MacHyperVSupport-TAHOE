name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Build the driver suite or the integrated setup package
        type: choice
        default: full
        options:
          - full
          - setup
  release:
    types: [published]

env:
  PROJECT_TYPE: KEXT
  ACID32: 1

jobs:
  build:
    name: Build
    if: inputs.mode != 'setup'
    runs-on: macos-15-intel
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/020b14fa68a9825642e0c0fb643c2963bd679ae3/ci-bootstrap.sh) || exit 1
          src=$(printf '%s\n' "$src" | sed -e 's/XCODE_VERSION="[^"]*"/XCODE_VERSION="16.4.0"/' -e 's#${DEVELOPER_DIR}/usr/bin/python3#/usr/bin/python3#g') || exit 1
          src=${src//acidanthera\/ocbuild\/master\//acidanthera\/ocbuild\/020b14fa68a9825642e0c0fb643c2963bd679ae3\/}
          eval "$src" || exit 1
      - name: macOS 10.13 SDK Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/020b14fa68a9825642e0c0fb643c2963bd679ae3/macosx10.13-sdk-bootstrap.sh) && eval "$src" || exit 1
      - name: Lilu Bootstrap
        run: |
          /usr/bin/curl -LfsS -o Lilu-SDK.zip https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip
          echo 'e95df95d82e8b151047abf359ecd9c853755c59293e19dfcc3907da8fbd8cf89  Lilu-SDK.zip' | shasum -a 256 -c -
          unzip -q Lilu-SDK.zip

      - run: xcodebuild -jobs 1 -target "Package Universal" -configuration Debug -arch ACID32 -arch x86_64
      - run: xcodebuild -jobs 1 -target "Package Universal" -configuration Release -arch ACID32 -arch x86_64

      - name: Record build provenance
        if: always()
        run: bash BuildScripts/record-provenance.sh
      - name: Upload provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Provenance
          path: provenance/
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/*/*.zip
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@e74ff71f7d8a4c4745b560a485cc5fdb9b5b999d
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*/*.zip
          tag: ${{ github.ref }}
          file_glob: true

  analyze-clang:
    name: Analyze Clang
    if: inputs.mode != 'setup'
    runs-on: macos-15-intel
    env:
      JOB_TYPE: ANALYZE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/020b14fa68a9825642e0c0fb643c2963bd679ae3/ci-bootstrap.sh) || exit 1
          src=$(printf '%s\n' "$src" | sed -e 's/XCODE_VERSION="[^"]*"/XCODE_VERSION="16.4.0"/' -e 's#${DEVELOPER_DIR}/usr/bin/python3#/usr/bin/python3#g') || exit 1
          src=${src//acidanthera\/ocbuild\/master\//acidanthera\/ocbuild\/020b14fa68a9825642e0c0fb643c2963bd679ae3\/}
          eval "$src" || exit 1
      - name: macOS 10.13 SDK Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/020b14fa68a9825642e0c0fb643c2963bd679ae3/macosx10.13-sdk-bootstrap.sh) && eval "$src" || exit 1
      - name: Lilu Bootstrap
        run: |
          /usr/bin/curl -LfsS -o Lilu-SDK.zip https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip
          echo 'e95df95d82e8b151047abf359ecd9c853755c59293e19dfcc3907da8fbd8cf89  Lilu-SDK.zip' | shasum -a 256 -c -
          unzip -q Lilu-SDK.zip

      - run: xcodebuild analyze -quiet -target "Package Universal" -configuration Debug -arch ACID32 -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]
      - run: xcodebuild clean -quiet -scheme "Package Universal"
      - run: xcodebuild analyze -quiet -target "Package Universal" -configuration Release -arch ACID32 -arch x86_64 CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR="$(pwd)/clang-analyze" && [ "$(find clang-analyze -name "*.html")" = "" ]

  analyze-coverity:
    name: Analyze Coverity
    runs-on: macos-15-intel
    env:
      JOB_TYPE: COVERITY
    if: github.repository_owner == 'acidanthera' && github.event_name != 'pull_request' && inputs.mode != 'setup'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/020b14fa68a9825642e0c0fb643c2963bd679ae3/ci-bootstrap.sh) || exit 1
          src=$(printf '%s\n' "$src" | sed -e 's/XCODE_VERSION="[^"]*"/XCODE_VERSION="16.4.0"/' -e 's#${DEVELOPER_DIR}/usr/bin/python3#/usr/bin/python3#g') || exit 1
          src=${src//acidanthera\/ocbuild\/master\//acidanthera\/ocbuild\/020b14fa68a9825642e0c0fb643c2963bd679ae3\/}
          eval "$src" || exit 1
      - name: macOS 10.13 SDK Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/020b14fa68a9825642e0c0fb643c2963bd679ae3/macosx10.13-sdk-bootstrap.sh) && eval "$src" || exit 1
      - name: Lilu Bootstrap
        run: |
          /usr/bin/curl -LfsS -o Lilu-SDK.zip https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip
          echo 'e95df95d82e8b151047abf359ecd9c853755c59293e19dfcc3907da8fbd8cf89  Lilu-SDK.zip' | shasum -a 256 -c -
          unzip -q Lilu-SDK.zip

      - name: Run Coverity
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/020b14fa68a9825642e0c0fb643c2963bd679ae3/coverity/covstrap.sh) && eval "$src" || exit 1
        env:
          COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          COVERITY_SCAN_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
          COVERITY_BUILD_COMMAND: xcodebuild -configuration Release


  integrated-setup:
    name: Integrated setup
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'setup'
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned driver build and download unchanged Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api repos/ditwal001-collab/MacHyperVSupport-TAHOE/actions/runs/40189441511 --jq .head_sha)" = 6c3568178ba21136b8c21dd45597476c74ec31d1
          test "$(gh api repos/ditwal001-collab/MacHyperVSupport-TAHOE/actions/runs/40189441511 --jq .conclusion)" = success
          gh run download 40189441511 --repo ditwal001-collab/MacHyperVSupport-TAHOE --name Artifacts --dir pinned-driver
      - name: Build and verify integrated setup
        run: |
          python3 BuildScripts/build-integrated-setup.py --release-zip pinned-driver/Release/MacHyperVSupport-0.9.10-RELEASE.zip --output-directory setup-build
          bash -n Tools/Setup/bootstrap.command
          bash -n Tools/Setup/Seed.command
      - uses: actions/upload-artifact@v4
        with:
          name: IntegratedSetup
          path: |
            setup-build/SetupMedia.zip
            setup-build/provenance.json
